# Environment used to produce every number and figure of the paper from the shipped checkpoints and outputs.
name: snapmmd-reproduction
channels: [pytorch, conda-forge, defaults]
dependencies:
  - python=3.8
  - pytorch=2.2.1
  - numpy=1.23.5
  - scipy=1.10.1
  - scikit-learn=1.3.2
  - matplotlib=3.7.1
  - pip
  - pip:
      - torchsde==0.2.6
      - POT==0.9.7.post1
      - tqdm              # imported by the snapMMD package
      - fire              # command-line entry point of the training scripts in fit/
      - -e ../package     # the snapMMD package of this repository
